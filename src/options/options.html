<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HA QuickTools — Settings</title>
  <style>
    body { font-family: "Segoe UI", Arial, sans-serif; background: #1a1f2e; color: #e0eaff; max-width: 480px; margin: 40px auto; padding: 0 20px; }
    h1 { font-size: 18px; font-weight: 600; margin-bottom: 24px; color: #41BDF5; }
    label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: #a0b0cc; }
    input { width: 100%; box-sizing: border-box; background: #232a35; border: 1px solid #4a5a7a; border-radius: 6px; color: #e0eaff; font-size: 14px; padding: 8px 12px; margin-bottom: 18px; outline: none; }
    input:focus { border-color: #41BDF5; }
    .hint { font-size: 12px; color: #6a7a9a; margin-top: -14px; margin-bottom: 18px; }
    button { background: #41BDF5; color: #0a1020; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; padding: 9px 20px; cursor: pointer; }
    button:hover { background: #5acfff; }
    #status { display: inline-block; margin-left: 12px; font-size: 13px; color: #4caf88; opacity: 0; transition: opacity 0.3s; }
    #status.show { opacity: 1; }
  </style>
</head>
<body>
  <h1>HA QuickTools — Settings</h1>

  <label for="ha-host">Home Assistant URL</label>
  <input type="text" id="ha-host" placeholder="http://homeassistant.home:8123" spellcheck="false"/>

  <label for="yt-webhook-id">YouTube / TV Webhook ID</label>
  <input type="text" id="yt-webhook-id" placeholder="-xJ8-jc3CsddRskLGtGVPL3Gx" spellcheck="false"/>

  <label for="clip-webhook-id">Phone Clipboard Webhook ID</label>
  <input type="text" id="clip-webhook-id" placeholder="-1W7q56JzQydahcNbF0mXstsX" spellcheck="false"/>

  <button id="save">Save Settings</button>
  <span id="status">Saved!</span>

  <script src="options.js"></script>
</body>
</html>
